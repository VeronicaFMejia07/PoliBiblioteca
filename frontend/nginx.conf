server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El contenedor 1 habla con el contenedor 2 a través de la red interna de Docker, usando el nombre del servicio como hostname.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
